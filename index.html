<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduAdmin - Dashboard Sekolah</title>
  <link rel="stylesheet" href="/index.css">
</head>

<body
  style="pointer-events: auto !important; user-select: auto !important; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;">
  <div id="root"></div>
  <script>
    // --- BASIC INTERACTION FIX ---
    // Memastikan klik kanan dan interaksi dasar tidak sengaja terblokir
    (function () {
      const fix = () => {
        document.oncontextmenu = null;
        document.body.style.pointerEvents = 'auto';
      };
      fix();
      window.addEventListener('load', fix);
      // Re-fix on any click just in case
      window.addEventListener('mousedown', fix, { passive: true });
    })();
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
